name: CI/CD Pipeline - Auto Escalado a Produccion

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-escalate:
    name: Validar Frontend y Escalar a QA y Main
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validar y Compilar Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Configurar Usuario Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Escalar a rama QA
        run: |
          git checkout qa
          git pull origin qa
          git merge origin/development --no-edit -m "ci(pipeline): auto-merge de development a qa [skip ci]"
          git push origin qa

      - name: Escalar a rama Main (Produccion Vercel)
        run: |
          git checkout main
          git pull origin main
          git merge origin/qa --no-edit -m "ci(pipeline): auto-merge de qa a main (produccion) [skip ci]"
          git push origin main
